# An example master profile for a fictional person. `cv init` copies it to profile/master.toml,
# which git ignores. Replace every fact with your own.
#
# The master profile holds everything true about you, once. A tailored CV only selects from it:
# it may reorder, drop and reword, but it can never add a fact, a number or a technology.
#
# Each bullet has an id, tags, and one or two wordings:
#   short = one tight bullet for a one-page CV
#   long  = a fuller version to draw detail from when a role calls for it
# Markup: *italic* (the lead-in of a bullet), **bold** (the numbers that prove the work),
# [label](https://...) for links.

[basics]
